# Local infrastructure. The API and web app run on the host (npm run dev).
# Neon is the primary database; the local Postgres here is for offline work and tests.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coinhub
      POSTGRES_PASSWORD: coinhub
      POSTGRES_DB: coinhub
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coinhub']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  pgdata:
